[metadata]
name = reneelutil
version = 0.1.0
description = Workflow for network analysis using reneel
author = Kunin Lab
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3 :: Only
    Programming Language :: Python :: 3.11
    Development Status :: 1 - Planning
    Intended Audience :: Mathematics/Research


[options]
packages =
    reneelutil
python_requires = >=3.11
package_dir = 
    =.
install_requires =
    pandas
    numpy

[options.extras_require]
test =
    pytest

[options.entry_points]
console_scripts =
    format_edgelist = reneelutil.format_edgelist:main
    run_reneel = reneelutil.run_reneel:main
